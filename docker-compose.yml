# ─── News Trends – produkciós környezet ───
# Indítás a szerveren:  docker compose up -d --build
# A változókat a projekt gyökerében lévő .env fájlból olvassa (minta: .env.production.example).

services:
  # PostgreSQL adatbázis – kívülről NEM érhető el, csak a belső Docker hálózaton
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SvelteKit alkalmazás (Node.js) – a cron feladatok is ebben a folyamatban futnak
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # A belső hálózaton a "db" szolgáltatásnévvel érjük el az adatbázist
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # A SvelteKit ez alapján ellenőrzi az űrlapok eredetét (CSRF védelem) és generálja az e-mail linkeket
      ORIGIN: https://${DOMAIN}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  # Caddy fordított proxy – HTTPS a Cloudflare Origin tanúsítvánnyal, továbbítás az alkalmazáshoz
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Napi adatbázis mentés – 14 napig őrzi meg a tömörített mentéseket a ./backups mappában
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        FAJL="/backups/newstrends_$$(date +%Y-%m-%d_%H%M).sql.gz";
        pg_dump | gzip > "$$FAJL" && echo "Mentés kész: $$FAJL";
        find /backups -name "newstrends_*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
